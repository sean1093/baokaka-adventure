<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>Option B Characters</title><link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;900&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0}body{width:600px;background:#F3E6CC;color:#2A2050;font-family:'Chiron GoRound TC',sans-serif;padding:20px}
h1{font-size:24px;font-weight:900}p{font:500 13px Fredoka;opacity:.75;margin:2px 0 12px}
.stage{height:300px;border-radius:24px;background:#22246A;display:flex;align-items:flex-end;justify-content:center;gap:0;padding-bottom:18px;position:relative;overflow:hidden}
.stage img{display:block}
.row{display:flex;gap:10px;margin-top:12px;align-items:center}
.t{width:70px;height:70px;border-radius:14px;display:grid;place-items:center}
.t img{width:48px;height:48px}.sil img{filter:brightness(0)}
.sw{display:flex;gap:6px;margin-top:12px}.sw span{flex:1;font:600 10px Fredoka;opacity:.85}.sw span i{display:block;height:30px;border-radius:8px;margin-bottom:3px;box-shadow:inset 0 0 0 1px rgba(128,128,128,.25)}
</style></head><body><h1>B · 剪紙夜燈 Paper-Cut Night</h1><p>Flat cut paper · no outlines · stacked drop shadows · 布袋戲 stage framing</p>
<div class="stage"><img src="baokaka-crawl.svg" width="290"><img src="mocha-cat.svg" width="210"></div>
<div class="row"><div class="t" style="background:#E9E1D3"><img src="baokaka-crawl.svg"></div><div class="t" style="background:#E9E1D3"><img src="mocha-cat.svg"></div><div class="t" style="background:#141A44"><img src="baokaka-crawl.svg"></div><div class="t" style="background:#141A44"><img src="mocha-cat.svg"></div><div class="t sil" style="background:#fff"><img src="baokaka-crawl.svg"></div><div class="t sil" style="background:#fff"><img src="mocha-cat.svg"></div></div>
<p style="margin-top:6px">48px on light / night / silhouette</p>
<div class="sw"><span><i style="background:#22246A"></i>night paper<br>#22246A</span><span><i style="background:#30338A"></i>indigo<br>#30338A</span><span><i style="background:#FFF1C9"></i>moon<br>#FFF1C9</span><span><i style="background:#FFCB4F"></i>butter<br>#FFCB4F</span><span><i style="background:#E8553D"></i>vermilion<br>#E8553D</span><span><i style="background:#2FA39A"></i>teal<br>#2FA39A</span><span><i style="background:#C8925A"></i>kraft<br>#C8925A</span><span><i style="background:#0E0B26"></i>shadow<br>#0E0B26</span></div></body></html>
