<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="400" height="400">
  <!--
    阿藍 (A-Lan, 藍教授) - Formosan blue magpie. 3/4 facing screen-right, standing.
    Identity: black hood, cobalt body, coral beak + legs, yellow eye ring, round reading glasses,
    an absurdly long white-tipped tail raised behind (her silhouette hook), pencil stub under the wing.
    Rig: al-shadow, al-tail, al-legs, al-body, al-wing, al-head, al-eyes, al-beak.
  -->
  <defs>
    <linearGradient id="al-blue" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#7DB4F5"/><stop offset="0.45" stop-color="#3F7FE0"/><stop offset="1" stop-color="#244FA8"/>
    </linearGradient>
    <linearGradient id="al-tailG" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2E62C4"/><stop offset="0.7" stop-color="#4C8BE6"/><stop offset="1" stop-color="#6FA6F0"/>
    </linearGradient>
    <radialGradient id="al-hood" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#55536E"/><stop offset="0.5" stop-color="#2E2C42"/><stop offset="1" stop-color="#1E1C2C"/>
    </radialGradient>
    <linearGradient id="al-coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A6E"/><stop offset="1" stop-color="#D9452F"/>
    </linearGradient>
    <radialGradient id="al-contact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2A1F3D" stop-opacity="0.42"/><stop offset="0.7" stop-color="#2A1F3D" stop-opacity="0.16"/><stop offset="1" stop-color="#2A1F3D" stop-opacity="0"/>
    </radialGradient>
    <path id="al-bodyShape" d="M40,62 C39,48 51,41 63,44 C74,47 79,59 75,71 C71,81 58,86 49,82.6 C43,80 40.4,72 40,62 Z"/>
    <path id="al-headShape" d="M66,18 C75.4,18 82,24.6 82,33.4 C82,40 78,45 73,47.6 C72,52 70,55 66,56 C60,54 55,50 52.6,44 C50.6,40.6 50,37 50,33.6 C50,24.8 56.8,18 66,18 Z"/>
    <clipPath id="al-bodyClip"><use href="#al-bodyShape"/></clipPath>
    <clipPath id="al-headClip"><use href="#al-headShape"/></clipPath>
  </defs>

  <ellipse id="al-shadow" cx="57" cy="92" rx="22" ry="4" fill="url(#al-contact)"/>

  <!-- the tail: two long paddles raised behind, white tips with a black band -->
  <g id="al-tail" transform="translate(47 63) scale(1.28) translate(-47 -63)">
    <path d="M45,66 C34,56 22,44 12,30 C10,27 13,24.6 16,26.4 C27,38 40,50 50,60 Z" fill="url(#al-tailG)" stroke="#3A2838" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M12,30 C10,27 13,24.6 16,26.4 C18,28.4 19.6,30.2 20.8,31.8 L15.6,35.4 C14.4,33.8 13.2,32 12,30 Z" fill="#FFFFFF"/>
    <path d="M15.6,35.4 L20.8,31.8 L23.4,35 L18.4,38.8 Z" fill="#232234"/>
    <path d="M46,70 C36,64 26,58 15,51 C12.4,49.6 13.6,46 16.8,46.8 C28,51 39,57 50,63 Z" fill="#3570D2" stroke="#3A2838" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M15,51 C12.4,49.6 13.6,46 16.8,46.8 L22,48.6 L19.6,53.4 Z" fill="#FFFFFF"/>
    <path d="M19.6,53.4 L22,48.6 L25.6,50 L23.2,55 Z" fill="#232234"/>
    <path d="M44,60 C34,50 25,40 17.6,30.4" stroke="#B8D6FF" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>

  <!-- legs -->
  <g id="al-legs" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M55,82 L53.6,90.6 M53.6,90.6 L49.6,91.6 M53.6,90.6 L57.4,91.6" stroke="#3A2838" stroke-width="4"/>
    <path d="M55,82 L53.6,90.6 M53.6,90.6 L49.6,91.6 M53.6,90.6 L57.4,91.6" stroke="#E5583E" stroke-width="2"/>
    <path d="M63.6,81 L64.4,90 M64.4,90 L60.6,91.2 M64.4,90 L68.4,91" stroke="#3A2838" stroke-width="4"/>
    <path d="M63.6,81 L64.4,90 M64.4,90 L60.6,91.2 M64.4,90 L68.4,91" stroke="#F06A4E" stroke-width="2"/>
  </g>

  <!-- body -->
  <g id="al-body">
    <use href="#al-bodyShape" fill="url(#al-blue)"/>
    <g clip-path="url(#al-bodyClip)">
      <path d="M60,66 C68,62 76,66 78,74 L78,90 L56,90 Z" fill="#A9C9F2" opacity="0.75"/>
      <path d="M66,46 C76,52 78,66 72,80 L84,84 L84,44 Z" fill="#1E4392" opacity="0.35"/>
      <ellipse cx="62" cy="50" rx="12" ry="5" fill="#16285E" opacity="0.4"/>
      <path d="M74.6,58 C76,64 75,70 72,75" stroke="#D8F0FF" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.9"/>
      <path d="M42,76 C50,82 62,82 72,76 L72,88 L42,88 Z" fill="#9CC8F0" opacity="0.2"/>
    </g>
    <use href="#al-bodyShape" fill="none" stroke="#3A2838" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- folded wing with white feather tips and a pencil stub tucked under it -->
  <g id="al-wing">
    <path d="M38.6,63.6 L31.4,58.4" stroke="#3A2838" stroke-width="4.6" stroke-linecap="round"/>
    <path d="M38.6,63.6 L31.4,58.4" stroke="#FFD25A" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M32.4,59.2 L30.4,57.8" stroke="#F4A0A8" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M46,56 C54,51.4 64,54 68.6,64 C66,72 56,76 46.6,73 C42.6,71 40.6,68 39.6,65 C41,61 43,58 46,56 Z" fill="#2F64C6" stroke="#3A2838" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M49,59 C55,56.6 61.6,58 65,63" stroke="#7DB4F5" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.9"/>
    <g fill="#FFFFFF"><path d="M41,66.4 l3.6,-0.6 -1.2,2.8 Z"/><path d="M43.4,70 l3.6,-0.8 -1,2.8 Z"/><path d="M47,72.6 l3.4,-1.2 -0.6,3 Z"/></g>
    <path d="M47,64 C52,62.6 58,63 62,66" stroke="#1E4392" stroke-width="1" fill="none" opacity="0.7"/>
  </g>

  <!-- head: black hood, yellow eye ring, glasses, coral beak -->
  <g id="al-head">
    <use href="#al-headShape" fill="url(#al-hood)"/>
    <g clip-path="url(#al-headClip)">
      <path d="M78,24 C84,32 82,44 74,50" stroke="#B8D6FF" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.85"/>
      <path d="M56,24 C60,20.4 66,19.4 71,20.4" stroke="#6E6C8C" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>
    <use href="#al-headShape" fill="none" stroke="#3A2838" stroke-width="1.9" stroke-linejoin="round"/>
    <g id="al-beak">
      <path d="M77,34 C82,32.6 88,33.4 92,36.4 C88,38.4 83,39.6 77.6,39.6 Z" fill="url(#al-coral)" stroke="#3A2838" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M78,37 C82.4,37 86.6,36.8 90.4,36.4" stroke="#B5322F" stroke-width="0.9" fill="none"/>
      <path d="M79.4,34.4 C82,33.8 84.6,33.9 86.6,34.6" stroke="#FFC4B0" stroke-width="0.9" stroke-linecap="round" fill="none"/>
    </g>
    <g id="al-eyes">
      <circle cx="77.2" cy="29.6" r="3.4" fill="#FFFFFF" stroke="#E9C24A" stroke-width="1.3"/>
      <circle cx="78" cy="29.8" r="1.7" fill="#2E1E2C"/>
      <circle cx="64.4" cy="31" r="5.6" fill="#FFFFFF" stroke="#F2CF4E" stroke-width="1.8"/>
      <circle cx="65.8" cy="31.6" r="3" fill="#2E1E2C"/>
      <circle cx="66.8" cy="30.2" r="1.15" fill="#FFFFFF"/>
      <circle cx="64.6" cy="33" r="0.55" fill="#FFFFFF" opacity="0.8"/>
    </g>
    <!-- round reading glasses -->
    <g fill="none" stroke="#C9962E" stroke-width="1.3">
      <circle cx="64.4" cy="31" r="8.2"/>
      <path d="M72.6,30.4 C73.6,29.4 74.6,29.2 75.6,29.4"/>
      <path d="M75.4,25 C78.6,24 81.6,25.6 82.4,28.6"/>
      <path d="M56.2,30.4 L51.6,29.4"/>
    </g>
    <path d="M58.6,26.2 C60.4,24.6 62.8,24 65,24.4" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>
</svg>
