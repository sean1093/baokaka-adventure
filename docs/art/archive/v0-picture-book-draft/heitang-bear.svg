<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="400" height="400">
  <!--
    黑糖 (Hēitáng) - young Formosan black bear. Standing, shy: paws pressed together, worried brows.
    Identity: glossy blue-black fur, cream V moon on the chest, red knitted scarf, tan muzzle, round ears.
    Black-on-night rule: a black character MUST carry a strong cool rim (#9CC8FF) plus glossy
    sky-tinted highlights, and a lighter muzzle and moon, or it disappears at 00:00. See art-direction.md §6.5.
    Rig: ht-shadow, ht-feet, ht-body, ht-scarf, ht-arm-far, ht-arm-near, ht-head, ht-ear-l, ht-ear-r, ht-eyes, ht-mouth.
  -->
  <defs>
    <linearGradient id="ht-fur" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#5A5470"/><stop offset="0.45" stop-color="#2E2A40"/><stop offset="1" stop-color="#18161F"/>
    </linearGradient>
    <radialGradient id="ht-headG" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#5E5874"/><stop offset="0.5" stop-color="#312C44"/><stop offset="1" stop-color="#1A1824"/>
    </radialGradient>
    <linearGradient id="ht-moon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6DE"/><stop offset="1" stop-color="#E9D2A6"/>
    </linearGradient>
    <linearGradient id="ht-tan" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#E6C49A"/><stop offset="1" stop-color="#B98C62"/>
    </linearGradient>
    <linearGradient id="ht-scarfG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6F5E"/><stop offset="1" stop-color="#C8343A"/>
    </linearGradient>
    <radialGradient id="ht-contact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2A1F3D" stop-opacity="0.45"/><stop offset="0.7" stop-color="#2A1F3D" stop-opacity="0.18"/><stop offset="1" stop-color="#2A1F3D" stop-opacity="0"/>
    </radialGradient>
    <path id="ht-bodyShape" d="M23,62 C19,76 23,88 34,91 L66,91 C77,88 81,76 77,62 C73,50 62,45 50,45 C38,45 27,50 23,62 Z"/>
    <path id="ht-headShape" d="M51,11 C64,11 73,19.6 73,30.4 C73,41.6 63.6,49 51,49 C38.4,49 29,41.6 29,30.4 C29,19.6 38,11 51,11 Z"/>
    <clipPath id="ht-bodyClip"><use href="#ht-bodyShape"/></clipPath>
    <clipPath id="ht-headClip"><use href="#ht-headShape"/></clipPath>
  </defs>

  <ellipse id="ht-shadow" cx="50" cy="93" rx="32" ry="5" fill="url(#ht-contact)"/>

  <g id="ht-feet">
    <ellipse cx="37" cy="90.4" rx="9" ry="4.4" fill="#26222F" stroke="#3A2838" stroke-width="1.6"/>
    <ellipse cx="64" cy="90.4" rx="9" ry="4.4" fill="#1E1B26" stroke="#3A2838" stroke-width="1.6"/>
    <ellipse cx="35" cy="89.4" rx="3.4" ry="1.4" fill="#8A8098" opacity="0.6"/>
  </g>

  <g id="ht-body">
    <use href="#ht-bodyShape" fill="url(#ht-fur)"/>
    <g clip-path="url(#ht-bodyClip)">
      <ellipse cx="50" cy="47" rx="22" ry="6" fill="#0E0C14" opacity="0.55"/>
      <!-- glossy sky-tinted highlight on the lit side -->
      <path d="M27,62 C26,70 27,78 30,84" stroke="#8FA8D8" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.55"/>
      <!-- the moon -->
      <path d="M34,55 C40,63 45,65.6 50.4,65.6 C55.6,65.6 60.6,63 66.4,55 C63,63 57.6,71.4 50.4,71.4 C43,71.4 37.4,63.4 34,55 Z" fill="url(#ht-moon)"/>
      <!-- strong cool rim, back-right -->
      <path d="M75.4,60 C78.6,70 77.6,82 70,90" stroke="#9CC8FF" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M24,84 C36,90 64,90 76,84 L76,92 L24,92 Z" fill="#9CC8F0" opacity="0.18"/>
    </g>
    <use href="#ht-bodyShape" fill="none" stroke="#3A2838" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- arms: paws pressed together in front of the belly, shy -->
  <g id="ht-arm-far">
    <path d="M71,57 C77,66 72,76 57.6,76.6 C53.4,76.8 53,71.6 56,70.6 C63,69 66.6,64 65.4,57 Z" fill="#1E1B28" stroke="#3A2838" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M71.6,61 C73,66 71,71 66,73.6" stroke="#9CC8FF" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85"/>
  </g>
  <g id="ht-arm-near">
    <path d="M29,57 C23,66 28,77 44,77.4 C48.4,77.6 49,72 45.6,71 C38,69.4 34.4,64 35.4,57 Z" fill="url(#ht-fur)" stroke="#3A2838" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M28,63 C27,68 29,72 33,74.4" stroke="#8FA8D8" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M44.6,72.4 L45.2,76.4 M47,72.6 L47.2,76.2" stroke="#4A4458" stroke-width="0.9" stroke-linecap="round"/>
  </g>

  <!-- red knitted scarf, the keeper's gift -->
  <g id="ht-scarf">
    <path d="M30,46 C38,51.6 64,51.6 72,46 C74.6,48 74.2,52.4 71,54 C62,57.6 40,57.6 31,54 C27.8,52.4 27.4,48 30,46 Z" fill="url(#ht-scarfG)" stroke="#3A2838" stroke-width="1.7" stroke-linejoin="round"/>
    <g stroke="#B5322F" stroke-width="0.9" stroke-linecap="round"><path d="M36,50.4 l1.2,3.4 M41,51.6 l1,3.4 M46,52.2 l0.6,3.4 M51,52.4 v3.4 M56,52.2 l-0.6,3.4 M61,51.6 l-1,3.4 M66,50.4 l-1.2,3.4"/></g>
    <path d="M33,52 L30.6,66 L36.4,65.4 L37.6,54 Z" fill="#E5483E" stroke="#3A2838" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M31,63.4 L36.6,62.8 M30.8,65.8 l-0.6,2 M33,65.6 l-0.2,2.2 M35.4,65.4 l0.2,2" stroke="#FFC4B0" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M34,49.4 C42,52.6 58,52.8 67,49.6" stroke="#FFB0A0" stroke-width="1" fill="none" opacity="0.8"/>
  </g>

  <!-- head -->
  <g id="ht-head">
    <g id="ht-ear-l">
      <circle cx="33.6" cy="15.4" r="7.4" fill="#2E2A40" stroke="#3A2838" stroke-width="1.8"/>
      <circle cx="34" cy="16" r="3.8" fill="#6E5A6A"/>
    </g>
    <g id="ht-ear-r">
      <circle cx="68.6" cy="15" r="7" fill="#221F2E" stroke="#3A2838" stroke-width="1.8"/>
      <circle cx="68.2" cy="15.6" r="3.4" fill="#5E4A5A"/>
      <path d="M72.4,10 C75,12 76,15 75.2,18" stroke="#9CC8FF" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    </g>
    <use href="#ht-headShape" fill="url(#ht-headG)"/>
    <g clip-path="url(#ht-headClip)">
      <path d="M71,22 C75,30 73,40 66,46" stroke="#9CC8FF" stroke-width="1.9" stroke-linecap="round" fill="none"/>
      <path d="M36,19 C40,15 46,13.4 52,13.6" stroke="#8A88A8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
    </g>
    <use href="#ht-headShape" fill="none" stroke="#3A2838" stroke-width="1.9"/>
    <!-- muzzle -->
    <ellipse cx="53.6" cy="36.4" rx="10" ry="7.4" fill="url(#ht-tan)" stroke="#8A5E3E" stroke-width="0.9"/>
    <ellipse cx="54" cy="32.6" rx="3.8" ry="2.6" fill="#1E1A24"/>
    <ellipse cx="53" cy="31.8" rx="1.3" ry="0.7" fill="#FFFFFF" opacity="0.7"/>
    <g id="ht-mouth"><path d="M50.4,38.6 C51.6,39.8 53,39.8 54,38.8 C55,39.8 56.6,39.8 57.6,38.6" stroke="#3A2838" stroke-width="1.1" fill="none" stroke-linecap="round"/></g>
    <!-- worried brows + eyes: big highlights so they read on black -->
    <path d="M38.4,24.6 L44,21.4 M61.6,21 L66.8,24" stroke="#A9A0BC" stroke-width="1.6" stroke-linecap="round"/>
    <g id="ht-eyes">
      <ellipse cx="42.6" cy="29.4" rx="3.2" ry="3.6" fill="#120E16" stroke="#6E6884" stroke-width="0.9"/>
      <ellipse cx="63.2" cy="28.8" rx="3" ry="3.4" fill="#120E16" stroke="#6E6884" stroke-width="0.9"/>
      <circle cx="43.6" cy="28.2" r="1.3" fill="#FFFFFF"/><circle cx="64.1" cy="27.6" r="1.2" fill="#FFFFFF"/>
      <circle cx="41.8" cy="30.8" r="0.55" fill="#FFFFFF" opacity="0.8"/><circle cx="62.4" cy="30.2" r="0.5" fill="#FFFFFF" opacity="0.8"/>
    </g>
    <ellipse cx="38.4" cy="36.4" rx="3.6" ry="2" fill="#FF8A80" opacity="0.4"/>
    <ellipse cx="67.6" cy="35.8" rx="3" ry="1.8" fill="#FF8A80" opacity="0.4"/>
    <!-- a little sweat drop: he's nervous -->
    <path d="M72.4,25 C73.6,27 74.2,28.4 73.6,29.4 C73,30.4 71.4,30.2 71.2,29 C71,28 71.6,26.6 72.4,25 Z" fill="#BFE6FF" stroke="#3A2838" stroke-width="0.8"/>
  </g>
</svg>
