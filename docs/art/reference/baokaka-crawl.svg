<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="400" height="400">
  <!--
    Baokaka (寶咖咖) - MAP sprite: crawling, 3/4 view facing screen-right. He can't walk until Ch10.
    Butter-yellow footie pajamas with a cream star print, a bear patch on the chest, a red string bracelet,
    cream grip-dot soles. Rig: bk-shadow, bk-foot-far, bk-arm-far, bk-legs, bk-foot-near, bk-body,
    bk-arm-near, bk-head, bk-eyes, bk-mouth. Crawl cycle = arms/legs alternate (section 6.4).
  -->
  <defs>
    <radialGradient id="bkc-skin" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFF3E8"/><stop offset="0.45" stop-color="#FFE0CB"/><stop offset="1" stop-color="#F2B7A2"/>
    </radialGradient>
    <linearGradient id="bkc-pj" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFE9A0"/><stop offset="0.45" stop-color="#FFD05A"/><stop offset="1" stop-color="#EFA23A"/>
    </linearGradient>
    <linearGradient id="bkc-hair" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#7A5040"/><stop offset="1" stop-color="#3E2621"/>
    </linearGradient>
    <radialGradient id="bkc-cheek" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF8A80" stop-opacity="0.75"/><stop offset="1" stop-color="#FF8A80" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bkc-contact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2A1F3D" stop-opacity="0.42"/><stop offset="0.7" stop-color="#2A1F3D" stop-opacity="0.16"/><stop offset="1" stop-color="#2A1F3D" stop-opacity="0"/>
    </radialGradient>
    <path id="bkc-bodyShape" d="M17,62 C17,50 30,45 42,49 C52,52 60,56 64,63 C67,70 63,79 55,81 C44,83 30,82 22,78 C17,74 16,68 17,62 Z"/>
    <path id="bkc-headShape" d="M70,23.5 C83,23.5 92.5,32 92.5,44 C92.5,56 83,65 70,65 C57,65 48,56.5 48,44.5 C48,32 57.5,23.5 70,23.5 Z"/>
    <clipPath id="bkc-bodyClip"><use href="#bkc-bodyShape"/></clipPath>
    <clipPath id="bkc-headClip"><use href="#bkc-headShape"/></clipPath>
  </defs>

  <ellipse id="bk-shadow" cx="50" cy="91" rx="38" ry="5" fill="url(#bkc-contact)"/>

  <!-- far foot (sole up, behind) -->
  <g id="bk-foot-far">
    <ellipse cx="20" cy="77" rx="5" ry="6.4" transform="rotate(-24 20 77)" fill="#F1E2C8" stroke="#3A2838" stroke-width="1.6"/>
  </g>
  <!-- far arm -->
  <g id="bk-arm-far">
    <path d="M55,66 C57,74 57,81 56,86" stroke="#3A2838" stroke-width="10.4" stroke-linecap="round" fill="none"/>
    <path d="M55,66 C57,74 57,81 56,86" stroke="#E7A23E" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="56.4" cy="88" r="3.3" fill="#F0BDA6" stroke="#3A2838" stroke-width="1.6"/>
  </g>
  <!-- folded legs: knees on the floor, shins running back -->
  <g id="bk-legs">
    <path d="M19,70 C14,79 18,89.4 29,89.8 C38,90.2 45,88.4 45,82.6 C45,76.4 39,72 31,70 Z" fill="url(#bkc-pj)" stroke="#3A2838" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M24,86 C30,88.6 38,88.8 43,86.4" stroke="#C97A2A" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M38,76 C41,78 42.4,81 42.4,84" stroke="#FFF6D0" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>
  <!-- near foot: cream sole with grip dots, the cutest read from behind -->
  <g id="bk-foot-near">
    <ellipse cx="14.6" cy="84" rx="5.6" ry="7" transform="rotate(-18 14.6 84)" fill="#FFF4E2" stroke="#3A2838" stroke-width="1.7"/>
    <g fill="#E39532"><circle cx="13.4" cy="81" r="0.9"/><circle cx="15.6" cy="83.6" r="0.9"/><circle cx="13.8" cy="86.4" r="0.9"/><circle cx="16.4" cy="80.2" r="0.7"/></g>
  </g>

  <!-- body: footie pajamas -->
  <g id="bk-body">
    <use href="#bkc-bodyShape" fill="url(#bkc-pj)"/>
    <g clip-path="url(#bkc-bodyClip)">
      <path d="M20,74 C34,82 52,82 64,72 L66,90 L16,90 Z" fill="#E8962E" opacity="0.45"/>
      <ellipse cx="60" cy="62" rx="10" ry="8" fill="#C4702A" opacity="0.45"/>
      <path d="M22,57 C26,51 34,48.6 42,50" stroke="#FFF6D0" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.75"/>
      <!-- star print -->
      <g fill="#FFF8E6" opacity="0.9">
        <path d="M30,58 l0.9,2 2,0.9 -2,0.9 -0.9,2 -0.9,-2 -2,-0.9 2,-0.9 Z"/>
        <path d="M42,55 l0.7,1.6 1.6,0.7 -1.6,0.7 -0.7,1.6 -0.7,-1.6 -1.6,-0.7 1.6,-0.7 Z"/>
        <path d="M27,70 l0.7,1.6 1.6,0.7 -1.6,0.7 -0.7,1.6 -0.7,-1.6 -1.6,-0.7 1.6,-0.7 Z"/>
        <path d="M38,68 l0.9,2 2,0.9 -2,0.9 -0.9,2 -0.9,-2 -2,-0.9 2,-0.9 Z"/>
        <circle cx="35" cy="62.4" r="0.8"/><circle cx="46" cy="72" r="0.8"/><circle cx="24" cy="64" r="0.7"/>
      </g>
      <!-- bear patch on the chest -->
      <g transform="translate(52 72)">
        <circle cx="-3.6" cy="-4" r="2" fill="#9A6A48" stroke="#6E4632" stroke-width="0.7"/>
        <circle cx="3.6" cy="-4" r="2" fill="#9A6A48" stroke="#6E4632" stroke-width="0.7"/>
        <circle cx="0" cy="0" r="5" fill="#B07C56" stroke="#6E4632" stroke-width="0.8"/>
        <ellipse cx="0" cy="1.6" rx="2.6" ry="2" fill="#F3DDBF"/>
        <circle cx="-1.8" cy="-1" r="0.7" fill="#3A2838"/><circle cx="1.8" cy="-1" r="0.7" fill="#3A2838"/>
        <circle cx="0" cy="1" r="0.7" fill="#3A2838"/>
      </g>
      <path d="M17,76 C30,84 52,84 64,76 L64,90 L17,90 Z" fill="#9CC8F0" opacity="0.18"/>
    </g>
    <use href="#bkc-bodyShape" fill="none" stroke="#3A2838" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- near arm with the red string bracelet -->
  <g id="bk-arm-near">
    <path d="M62,66 C66,74 67,81 67,86" stroke="#3A2838" stroke-width="10.6" stroke-linecap="round" fill="none"/>
    <path d="M62,66 C66,74 67,81 67,86" stroke="#FFD05A" stroke-width="7.2" stroke-linecap="round" fill="none"/>
    <path d="M62.6,69 C64.4,73 65.4,77 65.8,80" stroke="#FFF6D0" stroke-width="1.4" stroke-linecap="round" opacity="0.8" fill="none"/>
    <ellipse cx="67.6" cy="88.4" rx="4.4" ry="3.4" fill="url(#bkc-skin)" stroke="#3A2838" stroke-width="1.6"/>
    <path d="M63.8,85 C65.6,86.2 69.4,86.2 71,85" stroke="#E5483E" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <circle cx="67.4" cy="86" r="0.9" fill="#F7CF5A"/>
  </g>

  <!-- head: looking up at the viewer -->
  <g id="bk-head">
    <ellipse cx="49.6" cy="46.4" rx="4" ry="5" fill="#FFD9C2" stroke="#3A2838" stroke-width="1.7"/>
    <use href="#bkc-headShape" fill="url(#bkc-skin)"/>
    <g clip-path="url(#bkc-headClip)">
      <path d="M86,32 C95,42 92,58 76,66 L98,68 L98,30 Z" fill="#EB9C88" opacity="0.38"/>
      <path d="M91.2,38 C93,45 91.6,52 86.6,57.6" stroke="#D8F0FF" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.9"/>
    </g>
    <use href="#bkc-headShape" fill="none" stroke="#3A2838" stroke-width="1.9"/>
    <path d="M70.4,23 C69,17 72.6,13.6 77.4,14.8 C74.6,15.8 73.4,18.6 74.4,22.8" fill="none" stroke="#3A2838" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M70.4,23 C69,17 72.6,13.6 77.4,14.8 C74.6,15.8 73.4,18.6 74.4,22.8" fill="none" stroke="#6E4637" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M48.6,42 C48,30 57,22.4 70,22.4 C82,22.4 92,29.6 92.2,39 C89.6,35.6 86,34.2 82.4,35 C80.4,32.4 76.8,32 74,34 C71.4,31.4 67,31.8 64.8,34.6 C61,32.8 56.6,34.4 54.8,37.6 C52,38 50,39.6 48.6,42 Z" fill="url(#bkc-hair)" stroke="#3A2838" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M55,29 C60,25.4 67,24.4 73,25" stroke="#A97B63" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85"/>
    <ellipse cx="60.4" cy="53.6" rx="5.4" ry="3.4" fill="url(#bkc-cheek)"/>
    <ellipse cx="86.6" cy="52.6" rx="4.4" ry="3" fill="url(#bkc-cheek)"/>
    <g id="bk-eyes">
      <ellipse cx="65.6" cy="47.6" rx="3.2" ry="4.1" fill="#2E1E2C"/>
      <ellipse cx="81" cy="47.2" rx="3" ry="4" fill="#2E1E2C"/>
      <path d="M63,49.4 C64.1,51.6 67.1,51.6 68.2,49.4 C67.1,50.5 64.1,50.5 63,49.4 Z" fill="#7A4A38"/>
      <path d="M78.6,49 C79.6,51.1 82.4,51.1 83.4,49 C82.4,50.1 79.6,50.1 78.6,49 Z" fill="#7A4A38"/>
      <circle cx="66.8" cy="45.8" r="1.45" fill="#FFFFFF"/><circle cx="82.1" cy="45.4" r="1.35" fill="#FFFFFF"/>
      <circle cx="64.6" cy="49.2" r="0.65" fill="#FFFFFF" opacity="0.8"/><circle cx="80" cy="48.8" r="0.6" fill="#FFFFFF" opacity="0.8"/>
    </g>
    <path d="M72.4,52 C73.1,52.7 74.2,52.7 74.8,52" stroke="#D9937D" stroke-width="1" stroke-linecap="round" fill="none"/>
    <g id="bk-mouth">
      <path d="M70.2,55 C71.6,58.8 76.8,58.8 78.2,55 C75.8,55.9 72.6,55.9 70.2,55 Z" fill="#B8434A" stroke="#3A2838" stroke-width="1" stroke-linejoin="round"/>
      <path d="M72,57 C73,57.9 75.4,57.9 76.4,57 C75.4,56.6 73,56.6 72,57 Z" fill="#FF8F8F"/>
    </g>
  </g>
</svg>
