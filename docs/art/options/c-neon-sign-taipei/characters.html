<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>Option C Characters</title><link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;900&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0}body{width:600px;background:#0A0B24;color:#F2F4FF;font-family:'Chiron GoRound TC',sans-serif;padding:20px}
h1{font-size:24px;font-weight:900}p{font:500 13px Fredoka;opacity:.75;margin:2px 0 12px}
.stage{height:300px;border-radius:24px;background:radial-gradient(circle at 50% 40%,#1E1446,#070920 75%);display:flex;align-items:flex-end;justify-content:center;gap:0;padding-bottom:18px;position:relative;overflow:hidden}
.stage img{display:block}
.row{display:flex;gap:10px;margin-top:12px;align-items:center}
.t{width:70px;height:70px;border-radius:14px;display:grid;place-items:center}
.t img{width:48px;height:48px}.sil img{filter:brightness(0)}
.sw{display:flex;gap:6px;margin-top:12px}.sw span{flex:1;font:600 10px Fredoka;opacity:.85}.sw span i{display:block;height:30px;border-radius:8px;margin-bottom:3px;box-shadow:inset 0 0 0 1px rgba(128,128,128,.25)}
</style></head><body><h1>C · 霓虹夜光 Neon-Sign Taipei</h1><p>Dark city · neon-tube outlines · glow by stacked strokes · signage UI</p>
<div class="stage"><img src="baokaka-crawl.svg" width="290"><img src="mocha-cat.svg" width="210"></div>
<div class="row"><div class="t" style="background:#E9E1D3"><img src="baokaka-crawl.svg"></div><div class="t" style="background:#E9E1D3"><img src="mocha-cat.svg"></div><div class="t" style="background:#141A44"><img src="baokaka-crawl.svg"></div><div class="t" style="background:#141A44"><img src="mocha-cat.svg"></div><div class="t sil" style="background:#fff"><img src="baokaka-crawl.svg"></div><div class="t sil" style="background:#fff"><img src="mocha-cat.svg"></div></div>
<p style="margin-top:6px">48px on light / night / silhouette</p>
<div class="sw"><span><i style="background:#090A20"></i>void<br>#090A20</span><span><i style="background:#1C2050"></i>street<br>#1C2050</span><span><i style="background:#FFC94A"></i>warm tube<br>#FFC94A</span><span><i style="background:#FF4D8D"></i>pink<br>#FF4D8D</span><span><i style="background:#4DE3FF"></i>cyan<br>#4DE3FF</span><span><i style="background:#4DFFB0"></i>green<br>#4DFFB0</span><span><i style="background:#B57BFF"></i>violet<br>#B57BFF</span><span><i style="background:#FFF6D6"></i>core<br>#FFF6D6</span></div></body></html>
