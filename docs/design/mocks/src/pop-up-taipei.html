<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>翻翻台北 mock</title>
<style>
  html,body{margin:0;width:390px;height:844px;overflow:hidden;background:#b98a5e}
  svg{display:block;font-family:'WenQuanYi Zen Hei','Noto Sans TC',sans-serif}
</style>
<script src="parts.js"></script>
</head><body>
<svg id="s" width="390" height="844" viewBox="0 0 390 844"></svg>
<script>
const {babyCrawl, catSit, bubble, hand, INK} = P;
const brick = (x,y,w)=>`<rect x="${x}" y="${y}" width="${w}" height="10" fill="#c8624a"/>` +
  Array.from({length:Math.floor(w/18)},(_,i)=>`<path d="M${x+i*18+9} ${y} L${x+i*18+9} ${y+10}" stroke="#a24a36" stroke-width="1.5"/>`).join('');
const star=(x,y,r)=>`<path d="M${x} ${y-r} L${x+r*.3} ${y-r*.3} L${x+r} ${y} L${x+r*.3} ${y+r*.3} L${x} ${y+r} L${x-r*.3} ${y+r*.3} L${x-r} ${y} L${x-r*.3} ${y-r*.3} Z" fill="#ffe9a8"/>`;
const sparkle=(x,y,r,c='#fff4b0')=>`<path d="M${x} ${y-r} Q${x} ${y} ${x+r} ${y} Q${x} ${y} ${x} ${y+r} Q${x} ${y} ${x-r} ${y} Q${x} ${y} ${x} ${y-r} Z" fill="${c}" stroke="${INK}" stroke-width="1.4"/>`;
const mic=(x,y,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round">
   <rect x="-4" y="-6" width="8" height="30" rx="3" fill="#e7473c"/>
   <circle cx="0" cy="-16" r="12" fill="#d9dde6"/>
   <path d="M-8 -22 L8 -10 M-11 -14 L5 -26 M-4 -27 L10 -17" stroke="#9aa2b3" stroke-width="1.6"/>
   <rect x="-6" y="-6" width="12" height="5" fill="#ffd34d"/>
 </g>`;

let svg = `
<defs>
  <filter id="paper" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#3a2216" flood-opacity=".35"/></filter>
  <filter id="paperS" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="1.2" flood-color="#3a2216" flood-opacity=".35"/></filter>
  <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c99766"/><stop offset="1" stop-color="#a87547"/></linearGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f2a5c"/><stop offset="1" stop-color="#4b4f8f"/></linearGradient>
  <clipPath id="pg"><rect x="14" y="104" width="362" height="582" rx="10"/></clipPath>
  <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".6" fill="#000" opacity=".06"/><circle cx="4" cy="4" r=".5" fill="#fff" opacity=".08"/></pattern>
</defs>
<rect width="390" height="844" fill="url(#wood)"/>
<path d="M0 140 Q200 150 390 136 M0 420 Q190 430 390 414 M0 760 Q200 770 390 752" stroke="#9a6a3e" stroke-width="2" fill="none" opacity=".5"/>

<!-- HUD -->
<rect x="10" y="12" width="370" height="78" rx="18" fill="#fff8ea" stroke="${INK}" stroke-width="2.5"/>
<text x="26" y="42" font-size="20" font-weight="700" fill="${INK}">台北車站</text>
<text x="26" y="70" font-size="15" fill="#8a6a55">第二章 · 第 3 頁 / 7</text>
<g transform="translate(300 40)">
  <rect x="-44" y="-18" width="88" height="34" rx="17" fill="#2b3a6b" stroke="${INK}" stroke-width="2"/>
  <path d="M-30 -6 A9 9 0 1 0 -22 8 A7 7 0 1 1 -30 -6 Z" fill="#ffe08a"/>
  <text x="10" y="6" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">01:10</text>
</g>
<g transform="translate(192 66)">
  ${Array.from({length:9},(_,i)=>`<circle cx="${i*17}" cy="4" r="7" fill="${i<2?'#ffd34d':'#efe2cc'}" stroke="${INK}" stroke-width="1.8" ${i>=2?'stroke-dasharray="3 2"':''}/>`).join('')}
  <text x="148" y="9" font-size="12" fill="#8a6a55">抓周</text>
</g>

<!-- page edges -->
<rect x="20" y="110" width="362" height="582" rx="10" fill="#e8dcc4" stroke="${INK}" stroke-width="2"/>
<rect x="17" y="107" width="362" height="582" rx="10" fill="#efe4cd" stroke="${INK}" stroke-width="2"/>
<rect x="14" y="104" width="362" height="582" rx="10" fill="#fbf3e2" stroke="${INK}" stroke-width="2.5"/>

<g clip-path="url(#pg)">
  <!-- backdrop layer -->
  <rect x="14" y="104" width="362" height="440" fill="url(#sky)"/>
  ${star(60,140,6)}${star(330,160,5)}${star(110,200,4)}${star(250,128,4)}${star(355,230,3)}${star(40,250,3)}
  <circle cx="300" cy="190" r="26" fill="#fff3c4" stroke="${INK}" stroke-width="2" filter="url(#paperS)"/>
  <circle cx="292" cy="183" r="4" fill="#efe0a8"/><circle cx="308" cy="198" r="5" fill="#efe0a8"/>
  <!-- station silhouette (cut paper) -->
  <g filter="url(#paper)">
    <path d="M30 420 L30 330 L80 330 L80 300 L140 270 L195 240 L250 270 L310 300 L310 330 L360 330 L360 420 Z" fill="#6c7fc0" stroke="${INK}" stroke-width="2.2"/>
    <path d="M150 300 L195 266 L240 300 Z" fill="#8b9cd8" stroke="${INK}" stroke-width="2"/>
    ${[50,90,130,170,210,250,290,330].map(x=>`<rect x="${x}" y="350" width="22" height="34" rx="11" fill="#ffd77a" stroke="${INK}" stroke-width="1.6"/>`).join('')}
  </g>
  <!-- departure board -->
  <g filter="url(#paper)">
    <rect x="70" y="236" width="0" height="0"/>
    <rect x="34" y="150" width="190" height="66" rx="6" fill="#1d1d24" stroke="${INK}" stroke-width="2.2"/>
    <text x="46" y="176" font-size="15" font-weight="700" fill="#ffd34d">月亮線</text>
    <text x="130" y="176" font-size="15" font-weight="700" fill="#ffd34d">01:10</text>
    <text x="46" y="202" font-size="14" fill="#fff">往 寶咖咖的家</text>
    <path d="M34 183 L224 183" stroke="#3a3a46" stroke-width="1.5"/>
  </g>

  <!-- pillar on the right platform, Mocha on top -->
  <g filter="url(#paper)">
    <rect x="262" y="330" width="34" height="196" fill="#e9c98f" stroke="${INK}" stroke-width="2.2"/>
    <rect x="254" y="322" width="50" height="14" rx="3" fill="#d4ad6c" stroke="${INK}" stroke-width="2.2"/>
  </g>
  ${catSit({x:282,y:322,s:.62,look:'side'})}
  <!-- pigeon falling into gap -->
  <g transform="translate(232 400) rotate(-18)" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round">
    <path d="M-18 4 Q-30 -14 -8 -10 Q2 -22 14 -12 Q28 -16 20 2 Q8 14 -18 4 Z" fill="#b8bfd3"/>
    <path d="M-22 -2 L-34 -10 L-30 2 Z" fill="#9aa2b8"/>
    <path d="M-6 -10 Q4 -30 22 -24 Q12 -12 4 -8" fill="#cfd5e6"/>
    <circle cx="14" cy="-6" r="1.8" fill="${INK}" stroke="none"/>
    <path d="M20 -4 L26 -2 L20 0 Z" fill="#f2a46a"/>
  </g>
  <path d="M244 360 L240 378 M256 364 L250 382 M232 366 L230 380" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".9"/>
  ${bubble({x:300,y:262,w:62,h:30,text:'推～',fs:16,tail:'bl'})}

  <!-- floor layer: platforms + pit -->
  <rect x="14" y="526" width="362" height="160" fill="#7d6a8c"/>
  <g filter="url(#paper)">
    <path d="M14 526 L150 526 L150 640 L14 640 Z" fill="#f4dcae" stroke="${INK}" stroke-width="2.4"/>
    ${brick(14,526,136)}
    <path d="M250 526 L376 526 L376 640 L250 640 Z" fill="#f4dcae" stroke="${INK}" stroke-width="2.4"/>
    ${brick(250,526,126)}
    <path d="M150 536 L250 536" stroke="#ffd34d" stroke-width="0"/>
  </g>
  <!-- pit & rails -->
  <rect x="150" y="536" width="100" height="104" fill="#4c4060"/>
  <path d="M150 620 L250 620 M150 630 L250 630" stroke="#b9b2c9" stroke-width="3"/>
  <!-- paper train sliding in -->
  <g filter="url(#paper)">
    <rect x="74" y="528" width="152" height="74" rx="10" fill="#3d72c9" stroke="${INK}" stroke-width="2.4"/>
    <rect x="74" y="560" width="152" height="10" fill="#9ec3ff" stroke="none"/>
    ${[96,140,184].map(x=>`<rect x="${x}" y="538" width="30" height="18" rx="4" fill="#d9ecff" stroke="${INK}" stroke-width="1.8"/>`).join('')}
    <circle cx="104" cy="606" r="8" fill="#555" stroke="${INK}" stroke-width="2"/><circle cx="196" cy="606" r="8" fill="#555" stroke="${INK}" stroke-width="2"/>
  </g>
  <!-- the left platform covers the train tail (train comes out of the page slot) -->
  <path d="M14 526 L150 526 L150 640 L14 640 Z" fill="#f4dcae" stroke="${INK}" stroke-width="2.4"/>
  ${brick(14,526,136)}
  <path d="M150 526 L150 640" stroke="${INK}" stroke-width="2.4"/>
  <text x="40" y="580" font-size="13" fill="#b08d63">1</text><text x="340" y="580" font-size="13" fill="#b08d63">2</text>
  <path d="M40 600 Q80 594 120 600" stroke="#e3c48e" stroke-width="3" fill="none"/>
  <!-- gap hint -->
  <path d="M228 524 L248 524" stroke="#ff6a5c" stroke-width="3" stroke-dasharray="4 3"/>

  <!-- mic on pedestal -->
  <g filter="url(#paperS)">
    <rect x="318" y="500" width="40" height="26" rx="4" fill="#fff0c9" stroke="${INK}" stroke-width="2"/>
  </g>
  ${mic(338,478,1)}
  ${sparkle(318,448,9)}${sparkle(362,458,7)}${sparkle(352,430,5)}

  <!-- predicted crawl path -->
  <path d="M92 520 Q160 506 220 518 Q282 528 318 512" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/>
  <path d="M308 504 L322 511 L309 520" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- baby -->
  ${babyCrawl({x:66,y:526,s:.82})}
  <!-- thought bubble -->
  <g stroke="${INK}" stroke-width="2.2">
    <circle cx="86" cy="452" r="4" fill="#fff"/><circle cx="96" cy="440" r="6" fill="#fff"/>
    <rect x="68" y="388" width="96" height="44" rx="22" fill="#fff"/>
  </g>
  ${mic(94,418,.6)}
  <text x="136" y="417" text-anchor="middle" font-size="19" font-weight="700" fill="#e7473c">要！</text>

  <!-- pop-up crease -->
  <path d="M14 640 L376 640" stroke="#5a4a40" stroke-width="2" opacity=".5"/>
  <rect x="14" y="640" width="362" height="46" fill="#fbf3e2"/>
  <path d="M14 640 L376 640" stroke="${INK}" stroke-width="2.4"/>
</g>

<!-- pull tab sticking out of the page -->
<g filter="url(#paper)">
  <path d="M56 652 L176 652 L176 700 L76 700 Q56 700 56 680 Z" fill="#ffcf5a" stroke="${INK}" stroke-width="2.5"/>
  <text x="96" y="684" font-size="22" font-weight="700" fill="${INK}">拉</text>
  <path d="M128 676 L160 676 M150 666 L162 676 L150 686" stroke="${INK}" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<path d="M44 676 L20 676" stroke="${INK}" stroke-width="2" stroke-dasharray="3 3"/>
${hand({x:150,y:694,s:.9,rot:-10})}
<path d="M178 712 Q206 716 232 704" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="1 7"/>

<!-- bottom bar -->
<rect x="10" y="720" width="370" height="116" rx="20" fill="#fff8ea" stroke="${INK}" stroke-width="2.5"/>
<text x="195" y="745" text-anchor="middle" font-size="14" fill="#8a6a55">寶咖咖會自己爬——你只能 拉・轉・翻</text>
<g transform="translate(62 784)">
  <circle r="28" fill="#ffe7c2" stroke="#e7473c" stroke-width="4"/>
  ${catSit({x:0,y:22,s:.42})}
  <text y="44" text-anchor="middle" font-size="13" font-weight="700" fill="${INK}">摩卡</text>
</g>
<g transform="translate(150 784)">
  <circle r="24" fill="#fff" stroke="${INK}" stroke-width="2.4"/>
  <path d="M-8 4 Q-14 -2 -12 -10 Q-8 -20 0 -20 Q8 -20 12 -10 Q14 -2 8 4 L6 10 L-6 10 Z" fill="#ffe08a" stroke="${INK}" stroke-width="2"/>
  <path d="M-5 14 L5 14" stroke="${INK}" stroke-width="2.4"/>
  <text y="44" text-anchor="middle" font-size="13" fill="${INK}">提示</text>
</g>
<g transform="translate(222 784)">
  <circle r="24" fill="#fff" stroke="${INK}" stroke-width="2.4"/>
  <path d="M10 -6 A12 12 0 1 0 10 8" fill="none" stroke="${INK}" stroke-width="3"/>
  <path d="M6 -14 L12 -5 L2 -2" fill="none" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
  <text y="44" text-anchor="middle" font-size="13" fill="${INK}">重來</text>
</g>
<g transform="translate(266 768)" font-size="11" fill="${INK}">
  ${[['解開','#efe2cc'],['土地公','#efe2cc'],['淘氣','#efe2cc']].map(([t,c],i)=>`
    <g transform="translate(${i*36} 0)"><circle cx="16" cy="12" r="14" fill="${c}" stroke="${INK}" stroke-width="1.8" stroke-dasharray="3 2"/>
    <text x="16" y="46" text-anchor="middle">${t}</text></g>`).join('')}
  <path d="M10 12 L15 17 L23 7" stroke="${INK}" stroke-width="2.6" fill="none" opacity=".25"/>
</g>
`;
document.getElementById('s').innerHTML = svg;
</script>
</body></html>
