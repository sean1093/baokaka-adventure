<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="400" height="400">
  <!--
    Baokaka (寶咖咖) - BATTLE sprite: sitting up, legs splayed, a toy block raised (丟積木).
    1 year old, ~2 heads tall seated. Butter footie pajamas with a cream star print, bear patch,
    red string bracelet, grip-dot soles facing the viewer. Key light upper-left, rim back-right.
    Rig: bk-shadow, bk-legs, bk-arm-back, bk-body, bk-head, bk-eyes, bk-mouth, bk-arm-front, bk-block.
  -->
  <defs>
    <radialGradient id="bk-skin" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFF3E8"/>
      <stop offset="0.45" stop-color="#FFE0CB"/>
      <stop offset="1" stop-color="#F2B7A2"/>
    </radialGradient>
    <linearGradient id="bk-hair" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#7A5040"/>
      <stop offset="1" stop-color="#3E2621"/>
    </linearGradient>
    <linearGradient id="bk-pj" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFE9A0"/><stop offset="0.45" stop-color="#FFD05A"/><stop offset="1" stop-color="#EFA23A"/>
    </linearGradient>
    <linearGradient id="bk-red" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FF6F5E"/><stop offset="1" stop-color="#C8343A"/>
    </linearGradient>
    <radialGradient id="bk-cheek" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF8A80" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FF8A80" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bk-contact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2A1F3D" stop-opacity="0.42"/>
      <stop offset="0.7" stop-color="#2A1F3D" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2A1F3D" stop-opacity="0"/>
    </radialGradient>

    <path id="bk-headShape" d="M50,12.5 C64.5,12.5 74.5,22 74.5,35 C74.5,47.5 65,57 50,57 C35,57 25.5,47.5 25.5,35.5 C25.5,22 35.5,12.5 50,12.5 Z"/>
    <path id="bk-bodyShape" d="M35,56.5 C29,63 27,74 30,82.5 C39,87.6 61,87.6 70,82.5 C73,74 71,63 65,56.5 Z"/>
    <clipPath id="bk-headClip"><use href="#bk-headShape"/></clipPath>
    <clipPath id="bk-bodyClip"><use href="#bk-bodyShape"/></clipPath>
  </defs>

  <ellipse id="bk-shadow" cx="50" cy="91.5" rx="36" ry="5" fill="url(#bk-contact)"/>

  <!-- legs splayed forward, soles to the viewer -->
  <g id="bk-legs">
    <path d="M60,82 C66,85 70,87 74,88.6" stroke="#3A2838" stroke-width="13.4" stroke-linecap="round" fill="none"/>
    <path d="M60,82 C66,85 70,87 74,88.6" stroke="#EBA544" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M40,82 C34,85 30,87 26,88.6" stroke="#3A2838" stroke-width="13.4" stroke-linecap="round" fill="none"/>
    <path d="M40,82 C34,85 30,87 26,88.6" stroke="#FFD05A" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M38,80.6 C34,82.6 31,84.4 28.4,85.6" stroke="#FFF6D0" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.8"/>
    <ellipse cx="78.4" cy="88.4" rx="5.2" ry="6.4" transform="rotate(14 78.4 88.4)" fill="#F1E2C8" stroke="#3A2838" stroke-width="1.6"/>
    <g fill="#D88C30"><circle cx="78" cy="86" r="0.85"/><circle cx="79.6" cy="88.8" r="0.85"/><circle cx="77.8" cy="91.2" r="0.85"/></g>
    <ellipse cx="21.6" cy="88.4" rx="5.6" ry="6.8" transform="rotate(-14 21.6 88.4)" fill="#FFF4E2" stroke="#3A2838" stroke-width="1.7"/>
    <g fill="#E39532"><circle cx="22" cy="85.6" r="0.9"/><circle cx="20.4" cy="88.6" r="0.9"/><circle cx="22.2" cy="91.4" r="0.9"/><circle cx="23.6" cy="88.2" r="0.7"/></g>
  </g>

  <!-- back arm resting on the knee -->
  <g id="bk-arm-back">
    <path d="M62.6,60 C68,63 71,69 70.4,75" stroke="#3A2838" stroke-width="10.4" stroke-linecap="round" fill="none"/>
    <path d="M62.6,60 C68,63 71,69 70.4,75" stroke="#E7A23E" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="70" cy="77" r="3.2" fill="#F0BDA6" stroke="#3A2838" stroke-width="1.6"/>
  </g>

  <!-- body: footie pajamas -->
  <g id="bk-body">
    <use href="#bk-bodyShape" fill="url(#bk-pj)"/>
    <g clip-path="url(#bk-bodyClip)">
      <path d="M60,55 C67,63 69,75 66,90 L76,90 L76,55 Z" fill="#E08A2A" opacity="0.5"/>
      <ellipse cx="50" cy="57" rx="17" ry="5.5" fill="#C4702A" opacity="0.5"/>
      <path d="M33.4,64 C33,69 33,73 33.8,77" stroke="#FFF6D0" stroke-width="2.2" stroke-linecap="round" opacity="0.75" fill="none"/>
      <g fill="#FFF8E6" opacity="0.9">
        <path d="M38,66 l0.9,2 2,0.9 -2,0.9 -0.9,2 -0.9,-2 -2,-0.9 2,-0.9 Z"/>
        <path d="M62,68 l0.7,1.6 1.6,0.7 -1.6,0.7 -0.7,1.6 -0.7,-1.6 -1.6,-0.7 1.6,-0.7 Z"/>
        <path d="M41,79 l0.7,1.6 1.6,0.7 -1.6,0.7 -0.7,1.6 -0.7,-1.6 -1.6,-0.7 1.6,-0.7 Z"/>
        <path d="M59,80 l0.9,2 2,0.9 -2,0.9 -0.9,2 -0.9,-2 -2,-0.9 2,-0.9 Z"/>
        <circle cx="45" cy="62.6" r="0.8"/><circle cx="56" cy="62.4" r="0.8"/><circle cx="35" cy="73" r="0.7"/><circle cx="66" cy="76" r="0.7"/>
      </g>
      <g transform="translate(50 72)">
        <circle cx="-4.2" cy="-4.6" r="2.3" fill="#9A6A48" stroke="#6E4632" stroke-width="0.8"/>
        <circle cx="4.2" cy="-4.6" r="2.3" fill="#9A6A48" stroke="#6E4632" stroke-width="0.8"/>
        <circle cx="0" cy="0" r="5.8" fill="#B07C56" stroke="#6E4632" stroke-width="0.9"/>
        <ellipse cx="0" cy="1.9" rx="3" ry="2.3" fill="#F3DDBF"/>
        <circle cx="-2.1" cy="-1.2" r="0.8" fill="#3A2838"/><circle cx="2.1" cy="-1.2" r="0.8" fill="#3A2838"/>
        <circle cx="0" cy="1.2" r="0.8" fill="#3A2838"/>
      </g>
      <path d="M30,80 C40,85 60,85 70,80 L70,90 L30,90 Z" fill="#9CC8F0" opacity="0.2"/>
    </g>
    <use href="#bk-bodyShape" fill="none" stroke="#3A2838" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- soft round collar with cream piping -->
    <path d="M36,56 C41,61.4 59,61.4 64,56 C66.4,57.4 66,60.6 63.6,61.6 C57,64 43,64 36.4,61.6 C34,60.6 33.6,57.4 36,56 Z" fill="#FFF4DA" stroke="#3A2838" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M38,61 C44,62.6 56,62.6 62,61" stroke="#E8C79A" stroke-width="0.9" fill="none"/>
  </g>

  <!-- head -->
  <g id="bk-head">
    <ellipse cx="26.8" cy="40" rx="4.4" ry="5.4" fill="#FFD9C2" stroke="#3A2838" stroke-width="1.72"/>
    <path d="M27.4,37.6 C25.8,38.8 25.8,41.4 27.4,42.4" stroke="#E7A68E" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    <use href="#bk-headShape" fill="url(#bk-skin)"/>
    <g clip-path="url(#bk-headClip)">
      <!-- far-cheek form shadow, soft-edged by stacking two passes -->
      <path d="M68,26 C77,36 74,52 58,59 L80,62 L80,24 Z" fill="#F0A994" opacity="0.35"/>
      <path d="M70.5,30 C76,40 72,52 61,58 L80,62 L80,28 Z" fill="#EB9C88" opacity="0.4"/>
      <!-- rim light, back-right, cool sky colour -->
      <path d="M73.2,30 C75,38 73.5,46 68,52" stroke="#D8F0FF" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.9"/>
    </g>
    <use href="#bk-headShape" fill="none" stroke="#3A2838" stroke-width="1.89"/>

    <!-- hair cap with a soft fringe and the signature sprout -->
    <path d="M50.5,11.5 C49,6 52.4,2.6 57.2,3.8 C54.4,4.8 53.2,7.6 54.4,11.6" fill="none" stroke="#3A2838" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M50.5,11.5 C49,6 52.4,2.6 57.2,3.8 C54.4,4.8 53.2,7.6 54.4,11.6" fill="none" stroke="#6E4637" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M26.4,33.5 C25,19.5 36,11 50,11 C64.5,11 75.4,19.5 74.2,31 C71.4,27 67.6,25.4 63.4,26.4 C61.4,23.6 57.4,23 54.4,25.2 C51.4,22.2 46.4,22.6 44,25.8 C40,23.8 35.2,25.4 33.2,28.8 C30.2,29.2 28,31 26.4,33.5 Z" fill="url(#bk-hair)" stroke="#3A2838" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M33,19.6 C38,14.4 47,13 55,14.4" stroke="#A97B63" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M60.4,15.2 C64,16.4 67,18.6 68.8,21" stroke="#A97B63" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- cheeks: soft radial blush, never a hard circle -->
    <ellipse cx="36.6" cy="47.2" rx="6" ry="3.8" fill="url(#bk-cheek)"/>
    <ellipse cx="66" cy="46.6" rx="5" ry="3.4" fill="url(#bk-cheek)"/>

    <!-- face: eyes sit BELOW the head's midline (toddler proportion) -->
    <g id="bk-eyes">
      <ellipse cx="43" cy="40.6" rx="3.5" ry="4.5" fill="#2E1E2C"/>
      <ellipse cx="60.4" cy="40.4" rx="3.3" ry="4.4" fill="#2E1E2C"/>
      <path d="M40.2,42.6 C41.4,45 44.6,45 45.8,42.6 C44.6,43.8 41.4,43.8 40.2,42.6 Z" fill="#7A4A38"/>
      <path d="M57.8,42.4 C58.9,44.7 61.9,44.7 63,42.4 C61.9,43.6 58.9,43.6 57.8,42.4 Z" fill="#7A4A38"/>
      <circle cx="44.3" cy="38.6" r="1.55" fill="#FFFFFF"/>
      <circle cx="61.6" cy="38.4" r="1.45" fill="#FFFFFF"/>
      <circle cx="41.9" cy="42.4" r="0.7" fill="#FFFFFF" opacity="0.8"/>
      <circle cx="59.3" cy="42.2" r="0.65" fill="#FFFFFF" opacity="0.8"/>
    </g>
    <path d="M39.6,33.6 C41.4,32.6 43.6,32.6 45.2,33.4 M57.8,33.3 C59.4,32.5 61.4,32.5 63,33.3" stroke="#B4826B" stroke-width="1.1" stroke-linecap="round" fill="none"/>
    <path d="M51.4,45.6 C52.2,46.4 53.4,46.4 54,45.6" stroke="#D9937D" stroke-width="1.1" stroke-linecap="round" fill="none"/>
    <path d="M47.6,48.8 C49.2,52.8 55.2,52.8 56.8,48.8 C54.2,49.8 50.2,49.8 47.6,48.8 Z" fill="#B8434A" stroke="#3A2838" stroke-width="1.1" stroke-linejoin="round"/>
    <path d="M49.6,51 C50.8,52 53.6,52 54.8,51 C53.6,50.6 50.8,50.6 49.6,51 Z" fill="#FF8F8F"/>
  </g>

  <!-- front arm raising a toy block (丟積木) -->
  <g id="bk-arm-front">
    <g id="bk-block">
      <path d="M12.6,37.6 L18.6,34 L30,34 L24,37.6 Z" fill="#FF8F7E" stroke="#3A2838" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M24,37.6 L30,34 L30,45.4 L24,49 Z" fill="#B5322F" stroke="#3A2838" stroke-width="1.5" stroke-linejoin="round"/>
      <rect x="12.6" y="37.6" width="11.4" height="11.4" rx="1.2" fill="url(#bk-red)" stroke="#3A2838" stroke-width="1.6"/>
      <path d="M18.3,39.8 l1.4,3 3.2,0.4 -2.4,2.2 0.6,3.2 -2.8,-1.6 -2.8,1.6 0.6,-3.2 -2.4,-2.2 3.2,-0.4 Z" fill="#FFF4DA"/>
      <path d="M14,39.4 L14,46" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round" opacity="0.6"/>
    </g>
    <path d="M38,61 C32,59.6 27.4,56 25.4,51" stroke="#3A2838" stroke-width="10.6" stroke-linecap="round" fill="none"/>
    <path d="M38,61 C32,59.6 27.4,56 25.4,51" stroke="#FFD05A" stroke-width="7.2" stroke-linecap="round" fill="none"/>
    <path d="M35,58.6 C31,57.4 28.6,55 27.2,52.4" stroke="#FFF6D0" stroke-width="1.4" stroke-linecap="round" opacity="0.8" fill="none"/>
    <path d="M21.6,52.6 C23.4,54.2 27.2,54 28.6,52" stroke="#E5483E" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <circle cx="25" cy="53.2" r="0.85" fill="#F7CF5A"/>
    <circle cx="24.8" cy="48.8" r="3.6" fill="url(#bk-skin)" stroke="#3A2838" stroke-width="1.6"/>
  </g>
</svg>
