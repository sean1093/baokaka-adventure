<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>Option A Characters</title><link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;900&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0}body{width:600px;background:#FBF4E6;color:#2E2235;font-family:'Chiron GoRound TC',sans-serif;padding:20px}
h1{font-size:24px;font-weight:900}p{font:500 13px Fredoka;opacity:.75;margin:2px 0 12px}
.stage{height:300px;border-radius:24px;background:radial-gradient(circle at 50% 30%,#3B3C7A,#141A44 75%);display:flex;align-items:flex-end;justify-content:center;gap:0;padding-bottom:18px;position:relative;overflow:hidden}
.stage img{display:block}
.row{display:flex;gap:10px;margin-top:12px;align-items:center}
.t{width:70px;height:70px;border-radius:14px;display:grid;place-items:center}
.t img{width:48px;height:48px}.sil img{filter:brightness(0)}
.sw{display:flex;gap:6px;margin-top:12px}.sw span{flex:1;font:600 10px Fredoka;opacity:.85}.sw span i{display:block;height:30px;border-radius:8px;margin-bottom:3px;box-shadow:inset 0 0 0 1px rgba(128,128,128,.25)}
</style></head><body><h1>A · 繪本立體 Picture-Book Diorama</h1><p>Soft-lit vector · warm plum line · AO + rim light · floating dioramas</p>
<div class="stage"><img src="baokaka-crawl.svg" width="290"><img src="mocha-cat.svg" width="210"></div>
<div class="row"><div class="t" style="background:#E9E1D3"><img src="baokaka-crawl.svg"></div><div class="t" style="background:#E9E1D3"><img src="mocha-cat.svg"></div><div class="t" style="background:#141A44"><img src="baokaka-crawl.svg"></div><div class="t" style="background:#141A44"><img src="mocha-cat.svg"></div><div class="t sil" style="background:#fff"><img src="baokaka-crawl.svg"></div><div class="t sil" style="background:#fff"><img src="mocha-cat.svg"></div></div>
<p style="margin-top:6px">48px on light / night / silhouette</p>
<div class="sw"><span><i style="background:#141A44"></i>night<br>#141A44</span><span><i style="background:#2E2F6E"></i>indigo<br>#2E2F6E</span><span><i style="background:#FFD05A"></i>pajama<br>#FFD05A</span><span><i style="background:#CC8C52"></i>tabby<br>#CC8C52</span><span><i style="background:#3D7CC9"></i>MRT blue<br>#3D7CC9</span><span><i style="background:#FFD9A0"></i>lamp<br>#FFD9A0</span><span><i style="background:#D8F0FF"></i>rim<br>#D8F0FF</span><span><i style="background:#3A2838"></i>line<br>#3A2838</span></div></body></html>
